<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AstroTech - Registro de Bordo</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
    <div class="container mx-auto p-4">
        <h1 class="text-3xl font-bold text-center mb-6">AstroTech - Registro de Bordo</h1>

        <!-- Formulário para adicionar registros -->
        <div class="bg-white p-6 rounded-lg shadow-md mb-6">
            <h2 class="text-xl font-semibold mb-4">Adicionar Novo Registro</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Nome do Colaborador</label>
                    <input type="text" id="nome" class="mt-1 block w-full p-2 border border-gray-300 rounded-md" placeholder="Ex: João Silva" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Rota Desempenhada</label>
                    <input type="text" id="rota" class="mt-1 block w-full p-2 border border-gray-300 rounded-md" placeholder="Ex: Rota A" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Hora de Início</label>
                    <input type="time" id="horaInicio" class="mt-1 block w-full p-2 border border-gray-300 rounded-md" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Hora de Término</label>
                    <input type="time" id="horaTermino" class="mt-1 block w-full p-2 border border-gray-300 rounded-md" required>
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700">Observações</label>
                    <textarea id="observacoes" class="mt-1 block w-full p-2 border border-gray-300 rounded-md" rows="4" placeholder="Ex: Atraso no trânsito"></textarea>
                </div>
            </div>
            <div class="mt-4 flex space-x-4">
                <button onclick="salvarRegistro()" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700">Salvar</button>
                <button onclick="listarRegistros()" class="bg-gray-600 text-white px-4 py-2 rounded-md hover:bg-gray-700">Ver Registros</button>
            </div>
        </div>
